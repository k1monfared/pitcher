[workspace]
resolver = "2"
members = [
    "crates/pitcher-core",
    "crates/pitcher-cli",
    "server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["k1monfared"]

[workspace.dependencies]
pitcher-core = { path = "crates/pitcher-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
