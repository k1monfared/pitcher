name: Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The ubuntu runner image already provides ANDROID_HOME with platform
      # android-36 and build-tools 36.0.0, so no SDK setup step is needed.

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            echo "PITCHER_KEYSTORE=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::KEYSTORE_BASE64 is not set. A tagged release must be signed with the release key, otherwise each build gets a different debug key and Android refuses to update in place (users must uninstall first)."
            exit 1
          else
            echo "::warning::No release keystore; building with the debug key. Do not publish this artifact."
          fi

      - name: Build
        env:
          PITCHER_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PITCHER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PITCHER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # The fdroid flavour is the GitHub release, so F-Droid can verify its
        # reproducible build against this APK and ship it with this signature.
        run: |
          cd android
          ./gradlew :core:test :app:assembleFdroidRelease

      - name: Rename APK
        run: mv android/app/build/outputs/apk/fdroid/release/app-fdroid-release.apk "pitcher-android-${{ github.ref_name }}.apk"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pitcher-android-*.apk
          generate_release_notes: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pitcher-android-apk
          path: pitcher-android-*.apk
